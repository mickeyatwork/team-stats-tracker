<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Bright, energetic background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Colorful Stat Bar Gradients -->
    <linearGradient id="barCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="barLime" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="barCoral" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- 3D Football Shading -->
    <radialGradient id="ballShade" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>

    <!-- Shadow for football overlay -->
    <filter id="ballShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle bar glow -->
    <filter id="barGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>

  <!-- Tactical Pitch Grid Arc Accent -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Ascending Analytics Bar Chart (Bright & Colorful) -->
  <g filter="url(#barGlow)">
    <!-- Bar 1 (Left / Cyan) -->
    <rect x="22" y="66" width="16" height="42" rx="8" fill="url(#barCyan)"/>
    <!-- Bar 2 (Mid-Left / Emerald-Lime) -->
    <rect x="44" y="44" width="16" height="64" rx="8" fill="url(#barLime)"/>
    <!-- Bar 3 (Mid-Right / Warm Gold) -->
    <rect x="68" y="28" width="16" height="80" rx="8" fill="url(#barGold)"/>
    <!-- Bar 4 (Right / Bright Coral) -->
    <rect x="90" y="16" width="16" height="92" rx="8" fill="url(#barCoral)"/>
  </g>

  <!-- Football (Overlayed in Front of the Bars) -->
  <g filter="url(#ballShadow)">
    <!-- Ball Base Sphere -->
    <circle cx="64" cy="74" r="26" fill="url(#ballShade)"/>
    <circle cx="64" cy="74" r="26" fill="none" stroke="rgba(15,23,42,0.15)" stroke-width="1"/>

    <!-- Central Black Pentagon -->
    <polygon points="64,66 73,72 70,82 58,82 55,72" fill="#0f172a"/>

    <!-- Seam Lines from Central Pentagon -->
    <line x1="64" y1="66" x2="64" y2="50" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="73" y1="72" x2="85" y2="67" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="70" y1="82" x2="79" y2="92" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="58" y1="82" x2="49" y2="92" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <line x1="55" y1="72" x2="43" y2="67" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

    <!-- Surrounding Partial Edge Patches -->
    <!-- Top Patch -->
    <path d="M57 48.5 Q 64 51 71 48.5 Q 64 48 57 48.5 Z" fill="#0f172a"/>
    <!-- Top-Right Patch -->
    <path d="M85 64 Q 89 69 90 73 Q 86 70 83 67 Z" fill="#0f172a"/>
    <!-- Bottom-Right Patch -->
    <path d="M78 92 Q 81 87 84 85 Q 81 90 76 94 Z" fill="#0f172a"/>
    <!-- Bottom-Left Patch -->
    <path d="M50 92 Q 47 87 44 85 Q 47 90 52 94 Z" fill="#0f172a"/>
    <!-- Top-Left Patch -->
    <path d="M43 64 Q 39 69 38 73 Q 42 70 45 67 Z" fill="#0f172a"/>

    <!-- Ball Specular Light Highlight -->
    <ellipse cx="55" cy="62" rx="7" ry="4" fill="rgba(255,255,255,0.6)" transform="rotate(-30 55 62)"/>
  </g>
</svg>
