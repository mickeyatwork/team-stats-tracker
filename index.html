<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>team-stats-tracker</title>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('app_theme_preference');
          if (theme === 'crimson') {
            document.documentElement.setAttribute('data-theme', 'crimson');
          } else {
            document.documentElement.setAttribute('data-theme', 'cyan');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
